<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ライフ計算</title>

<style>

body{
    margin:0;
    background:#123456;
    color:white;
    font-family:sans-serif;
    text-align:center;
}

.screen{
    display:none;
    padding:20px;
}

.active{
    display:block;
}
/* プレイヤー人数 */
select {
  width: 60px;           /* 横幅 */
  height: 40px;           /* 高さ */
  font-size: 20px;        /* 文字サイズ */
  padding: 5px 10px;      /* 内側の余白 */
}

/* 初期ライフと開始ボタン */
button,input{
    font-size:20px;
    padding:20px;
    margin:5px;
    border:none;
    border-radius:10px;
}

button{
    background:#444;
    color:white;
}

input{
    width:150px;
    text-align:center;
}

#tableArea{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    margin-top:20px;
}

.row{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.player{
    background:#222;
    padding:20px;
    border-radius:15px;
    width:min(22vw, 100px);
}

.top-player{
    transform:rotate(180deg);
}

.life{
    font-size:min(8vw, 30px);
    margin-top:10px;
    cursor:pointer;
}

#calcScreen{
    height:100vh;
    box-sizing:border-box;
    overflow:hidden;
}

#calcScreen.active{
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.calc-display{
    font-size:min(10vw,30px);
    margin:-2vh;
}

.current-life{
    font-size:min(5vw,28px);
    margin-bottom:1vh;
}

.calc-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    max-width:420px;
    margin:auto;
}

.calc-buttons button{
    height:50px;
    font-size:20px;
}


.utility{
    background:#1d1d1d;
    border-radius:20px;
    padding:20px 40px;
}

.rotated{
    transform:rotate(180deg);
}



button:active{
    transform:scale(0.95);
}

@media screen and (orientation: landscape){

    .player{
        width:150px;
        padding:6px;
    }

    .life{
        font-size:30px;
    }

    button{
        font-size:20px;
        padding:6px;
    }

    .utility{
        font-size:25px;
        padding:4px;
    }

    #tableArea{
        gap:20px;
    }
}
</style>
</head>

<body>

<!-- 初期設定 -->
<div id="setupScreen" class="screen active">

    <h1>ライフ計算</h1>

    <div>
        <p>プレイヤー人数</p>

        <select id="playerCount">
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
        </select>
    </div>

    <div>
        <p>初期ライフ</p>

        <input type="number"
               id="initialLife"
               value="8000">
    </div>

    <button onclick="startGame()">ゲーム開始</button>

</div>

<!-- 開始プレイヤー -->
<div id="startScreen" class="screen">

    <h1>開始プレイヤー</h1>

    <h2 id="starterText"></h2>

    <button onclick="showGame()">対戦開始</button>

</div>

<!-- メイン -->
<div id="gameScreen" class="screen">

    <div id="tableArea"></div>

</div>

<!-- 計算 -->
<div id="calcScreen" class="screen">

    <h1 id="calcPlayerName"></h1>

    <div class="current-life">
        現在LP:
        <span id="currentLife"></span>
    </div>

    <div class="calc-display" id="calcDisplay">0</div>

    <div class="calc-buttons">

        <button onclick="pressCalc('7')">7</button>
        <button onclick="pressCalc('8')">8</button>
        <button onclick="pressCalc('9')">9</button>
        <button onclick="setOperator('+')">+</button>

        <button onclick="pressCalc('4')">4</button>
        <button onclick="pressCalc('5')">5</button>
        <button onclick="pressCalc('6')">6</button>
        <button onclick="setOperator('-')">-</button>

        <button onclick="pressCalc('1')">1</button>
        <button onclick="pressCalc('2')">2</button>
        <button onclick="pressCalc('3')">3</button>
        <button onclick="applyCalc()">=</button>

        <button onclick="pressCalc('0')">0</button>
        <button onclick="pressCalc('00')">00</button>
        <button onclick="clearCalc()">C</button>
        <button onclick="cancelCalc()">戻る</button>

    </div>

</div>

<script>

let players = [];

let currentPlayer = null;

let calcValue = "";
let calcOperator = "";

function changeScreen(id){

    document.querySelectorAll(".screen").forEach(s=>{
        s.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}

function startGame(){

    const count =
        Number(document.getElementById("playerCount").value);

    const life =
        Number(document.getElementById("initialLife").value);

    players = [];

    for(let i=0;i<count;i++){

        players.push({
            name:"ユーザー " + (i+1),
            life:life
        });
    }

    const starter =
        Math.floor(Math.random()*count);

    document.getElementById("starterText").innerText =
        players[starter].name;

    changeScreen("startScreen");
}

function createPlayerHTML(player,index){

    return `
    <div class="player">
        <h2>${player.name}</h2>

        <div class="life"
             onclick="openCalculator(${index})">
             ${player.life}
        </div>
    </div>
    `;
}

function showGame(){

    const area =
        document.getElementById("tableArea");

    area.innerHTML = "";

    const count = players.length;

    const topCount =
        Math.ceil(count/2);

    const bottomCount =
        Math.floor(count/2);

    let topHTML = "";
    let bottomHTML = "";

    for(let i=0;i<topCount;i++){

        topHTML += `
        <div class="player top-player">
            <h2>${players[i].name}</h2>

            <div class="life"
                 onclick="openCalculator(${i})">
                 ${players[i].life}
            </div>
        </div>
        `;
    }

    for(let i=0;i<bottomCount;i++){

        const index = topCount + i;

        bottomHTML += `
        <div class="player">
            <h2>${players[index].name}</h2>

            <div class="life"
                 onclick="openCalculator(${index})">
                 ${players[index].life}
            </div>
        </div>
        `;
    }

    area.innerHTML = `
    <div class="row">${topHTML}</div>

    <div class="utility">

        <button onclick="rollDice()">🎲 ダイス</button>
        <span id="diceResult">-</span>

        <button onclick="flipCoin()">🪙 コイン</button>
        <span id="coinResult">-</span>

    </div>

    <div class="row">${bottomHTML}</div>
`;

    changeScreen("gameScreen");
}

function openCalculator(index){

    currentPlayer = index;

    calcValue = "";

    calcOperator = "";

    document.getElementById("calcDisplay")
        .innerText = "0";

    document.getElementById("calcPlayerName")
        .innerText = players[index].name;

    document.getElementById("currentLife")
        .innerText = players[index].life;

    const calcScreen =
        document.getElementById("calcScreen");

    calcScreen.classList.remove("rotated");

    const topCount =
        Math.ceil(players.length / 2);

    if(index < topCount){

        calcScreen.classList.add("rotated");
    }

    changeScreen("calcScreen");
}

function pressCalc(num){

    calcValue += num;

    document.getElementById("calcDisplay")
        .innerText =
        calcOperator + " " + calcValue;
}

function setOperator(op){

    calcOperator = op;

    document.getElementById("calcDisplay")
        .innerText =
        calcOperator + " " + calcValue;
}

function clearCalc(){

    calcValue = "";

    calcOperator = "";

    document.getElementById("calcDisplay")
        .innerText = "0";
}

function applyCalc(){

    const value = Number(calcValue);

    if(calcOperator === "+"){

        players[currentPlayer].life += value;
    }

    if(calcOperator === "-"){

        players[currentPlayer].life -= value;
    }

    showGame();
}

function cancelCalc(){

    showGame();
}

function rollDice(){

    const display =
        document.getElementById("diceResult");

    display.innerText = "🎲...";

    setTimeout(()=>{

        const result =
            Math.floor(Math.random()*6)+1;

        display.innerText = result;

    },300);
}

function flipCoin(){

    const display =
        document.getElementById("coinResult");

    display.innerText = "🪙...";

    setTimeout(()=>{

        const result =
            Math.random()<0.5 ? "表" : "裏";

        display.innerText = result;

    },300);
}

</script>

</body>
</html>
